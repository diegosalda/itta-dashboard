<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Itta Pizzaria — Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0e0e12;--bg2:#16161e;--bg3:#1e1e28;--bg4:#252534;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --txt:#f0eee8;--txt2:#9a97a8;--txt3:#5a5768;
  --r:#e03535;--c:#EFE4CE;
  --green:#22c55e;--orange:#f97316;--purple:#a855f7;
  --blue:#3b82f6;--yellow:#eab308;--teal:#14b8a6;
  --radius:14px;--radius-sm:10px;
}
*:not(canvas){transition:background-color .2s,color .2s,border-color .2s}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
[data-theme='light']{
  --bg:#f5f5f0;--bg2:#ffffff;--bg3:#f0ede8;--bg4:#e8e4de;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --txt:#1a1a1a;--txt2:#4a4a5a;--txt3:#8a8799;
  --r:#c92a2a;--c:#8B1A1A;
  --green:#1a9e4a;--orange:#d4680a;--purple:#7c3aed;
  --blue:#2563eb;--yellow:#b45309;--teal:#0d9488;
}
[data-theme='light'] .nav-item.active{background:linear-gradient(135deg,rgba(201,42,42,.1),rgba(124,58,237,.06));border-color:rgba(201,42,42,.2)}
[data-theme='light'] .bloco.peak{background:linear-gradient(135deg,rgba(201,42,42,.12),rgba(124,58,237,.08));border-color:rgba(201,42,42,.2)}
[data-theme='light'] .dc.peak{background:linear-gradient(135deg,rgba(212,104,10,.15),rgba(180,83,9,.08));border-color:rgba(212,104,10,.25)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;transition:transform .25s}
.content{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}

/* SIDEBAR */
.logo-wrap{padding:20px 20px 18px;border-bottom:1px solid var(--border)}
.logo{font-size:20px;font-weight:800;letter-spacing:3px;color:var(--c)}
.logo small{display:block;font-size:9px;letter-spacing:4px;color:var(--txt3);font-weight:400;margin-top:2px}
.nav{padding:12px;flex:1;overflow-y:auto}
.nav-sec{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--txt3);text-transform:uppercase;padding:12px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--txt2);transition:all .15s;margin-bottom:1px;border:1px solid transparent}
.nav-item:hover{background:var(--bg3);color:var(--txt)}
.nav-item.active{background:linear-gradient(135deg,rgba(224,53,53,.18),rgba(168,85,247,.1));color:var(--txt);border-color:rgba(224,53,53,.2)}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border)}
.sync-row{display:flex;align-items:center;gap:7px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0}
.sync-txt{font-size:11px;color:var(--txt3)}

/* TOPBAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-shrink:0}
.topbar-l{display:flex;align-items:center;gap:10px}
.menu-btn{display:none;background:none;border:none;color:var(--txt2);font-size:20px;cursor:pointer;padding:4px}
.page-ttl{font-size:15px;font-weight:700}
.period-lbl{font-size:11px;color:var(--txt3);margin-left:6px}
.btn-apply{background:var(--r);color:#fff;border:none;padding:7px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:opacity .15s}
.btn-apply:hover{opacity:.85}
.btn-theme{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);width:32px;height:32px;border-radius:var(--radius-sm);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.btn-theme:hover{background:var(--bg4)}

/* FILTROS */
.flt-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;flex-shrink:0}
.flt{display:flex;flex-direction:column;gap:3px}
.flt label{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px}
.flt select,.flt input[type=date]{background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:6px 10px;border-radius:8px;font-size:12px;font-family:inherit;-webkit-appearance:none;min-width:120px}
.flt select:focus,.flt input:focus{outline:none;border-color:rgba(224,53,53,.5)}
.dias-row{display:flex;gap:3px}
.db{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--txt3);font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.db.on{background:rgba(224,53,53,.18);border-color:rgba(224,53,53,.4);color:var(--r)}
.hora-row{display:flex;align-items:center;gap:5px}
.hora-row span{font-size:10px;color:var(--txt3)}
.comp-pill{background:var(--bg3);border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-trocar{color:var(--r);background:none;border:none;font-size:10px;cursor:pointer;font-family:inherit;font-weight:700;text-decoration:underline}

/* MAIN */
.main{padding:20px;flex:1}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.mc{background:var(--bg2);border-radius:var(--radius);padding:18px;border:1px solid var(--border);position:relative;overflow:hidden}
.mc::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--radius) var(--radius) 0 0}
.mc.green::after{background:linear-gradient(90deg,var(--green),transparent)}
.mc.orange::after{background:linear-gradient(90deg,var(--orange),transparent)}
.mc.purple::after{background:linear-gradient(90deg,var(--purple),transparent)}
.mc.red::after{background:linear-gradient(90deg,var(--r),transparent)}
.mc.blue::after{background:linear-gradient(90deg,var(--blue),transparent)}
.mc.teal::after{background:linear-gradient(90deg,var(--teal),transparent)}
.mc-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px}
.mc.green .mc-icon{background:rgba(34,197,94,.13)}
.mc.orange .mc-icon{background:rgba(249,115,22,.13)}
.mc.purple .mc-icon{background:rgba(168,85,247,.13)}
.mc.red .mc-icon{background:rgba(224,53,53,.13)}
.mc.blue .mc-icon{background:rgba(59,130,246,.13)}
.mc.teal .mc-icon{background:rgba(20,184,166,.13)}
.mc-lbl{font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.mc-val{font-size:26px;font-weight:800;line-height:1}
.mc.green .mc-val{color:var(--green)}
.mc.orange .mc-val{color:var(--orange)}
.mc.purple .mc-val{color:var(--purple)}
.mc.red .mc-val{color:var(--r)}
.mc.blue .mc-val{color:var(--blue)}
.mc.teal .mc-val{color:var(--teal)}
.mc-comp{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
.db2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.up{background:rgba(34,197,94,.15);color:var(--green)}
.dn{background:rgba(224,53,53,.15);color:var(--r)}
.mc-ct{font-size:10px;color:var(--txt3)}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.g31{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}

/* CARD */
.card{background:var(--bg2);border-radius:var(--radius);padding:18px;border:1px solid var(--border)}
.card-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.card-ttl{font-size:13px;font-weight:700}
.card-sub{font-size:10px;color:var(--txt3);margin-top:2px}

/* RANKING */
.ri{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.ri:last-child{border:none;padding-bottom:0}
.ri-pos{font-size:12px;font-weight:800;width:18px;text-align:center;flex-shrink:0;color:var(--txt3)}
.ri-pos.g1{color:var(--yellow)}
.ri-pos.g2{color:var(--txt2)}
.ri-pos.g3{color:var(--orange)}
.ri-info{flex:1;min-width:0}
.ri-nome{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-tags{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap}
.tag{font-size:9px;padding:1px 5px;border-radius:5px;font-weight:600}
.tag-G{background:rgba(59,130,246,.15);color:var(--blue)}
.tag-M{background:rgba(20,184,166,.15);color:var(--teal)}
.tag-P{background:rgba(168,85,247,.15);color:var(--purple)}
.tag-S{background:rgba(224,53,53,.12);color:var(--r)}
.tag-D{background:rgba(234,179,8,.12);color:var(--yellow)}
.ri-bar{height:3px;background:var(--bg3);border-radius:2px;margin-top:5px}
.ri-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--r),var(--purple))}
.ri-d{font-size:9px;margin-top:3px;display:flex;align-items:center;gap:4px}
.ri-qtd{font-size:14px;font-weight:800;color:var(--txt);width:34px;text-align:right;flex-shrink:0}

/* BLOCOS */
.blocos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.bloco{background:var(--bg3);border-radius:10px;padding:10px 4px;text-align:center;border:1px solid var(--border)}
.bloco.peak{background:linear-gradient(135deg,rgba(224,53,53,.22),rgba(168,85,247,.12));border-color:rgba(224,53,53,.3)}
.bl-h{font-size:9px;font-weight:600;color:var(--txt3);margin-bottom:3px}
.bl-v{font-size:16px;font-weight:800;color:var(--txt)}
.bloco.peak .bl-v{color:var(--r)}
.bl-d{font-size:8px;color:var(--txt3);margin-top:2px}
.bloco.peak .bl-d{color:rgba(224,53,53,.7)}

/* DIAS */
.dias-cards{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dc{background:var(--bg3);border-radius:10px;padding:10px 4px;text-align:center;border:1px solid var(--border)}
.dc.peak{background:linear-gradient(135deg,rgba(249,115,22,.2),rgba(234,179,8,.1));border-color:rgba(249,115,22,.3)}
.dc-n{font-size:9px;font-weight:700;color:var(--txt3)}
.dc.peak .dc-n{color:var(--orange)}
.dc-v{font-size:15px;font-weight:800;color:var(--txt);margin-top:3px}
.dc-d{font-size:8px;color:var(--txt3);margin-top:1px}
.dc.peak .dc-d{color:var(--orange)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--border)}
tr:last-child td{border:none}
tr:hover td{background:rgba(255,255,255,.02)}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--txt3)}
.spin{width:32px;height:32px;border:3px solid var(--bg3);border-top-color:var(--r);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* MOBILE */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:199}
.overlay.show{display:block}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .content{margin-left:0}
  .menu-btn{display:flex}
  .metrics{grid-template-columns:1fr 1fr}
  .g2,.g3,.g31{grid-template-columns:1fr}
  .blocos{grid-template-columns:repeat(4,1fr)}
  .dias-cards{grid-template-columns:repeat(4,1fr)}
  .main{padding:14px}
}
@media(max-width:480px){
  .metrics{grid-template-columns:1fr}
  .blocos{grid-template-columns:repeat(3,1fr)}
}

/* LOGIN */
.login-overlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:380px;text-align:center}
.login-logo{font-size:28px;font-weight:800;letter-spacing:4px;color:var(--c);margin-bottom:4px}
.login-sub{font-size:10px;letter-spacing:4px;color:var(--txt3);margin-bottom:32px}
.login-field{text-align:left;margin-bottom:14px}
.login-field label{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:5px}
.login-field input{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt);padding:10px 14px;border-radius:10px;font-size:14px;font-family:inherit}
.login-field input:focus{outline:none;border-color:rgba(224,53,53,.5)}
.login-btn{width:100%;padding:12px;background:var(--r);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .15s}
.login-btn:hover{opacity:.85}
.login-err{background:rgba(224,53,53,.12);border:1px solid rgba(224,53,53,.3);color:var(--r);padding:8px 12px;border-radius:8px;font-size:12px;margin-top:12px;display:none}
.login-loading{color:var(--txt3);font-size:12px;margin-top:12px;display:none}
.user-info{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--r),var(--purple));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:11px;font-weight:600;color:var(--txt2)}
.user-role{font-size:9px;color:var(--txt3)}
.btn-logout{margin-left:auto;background:none;border:none;color:var(--txt3);cursor:pointer;font-size:11px;font-family:inherit;padding:2px 6px;border-radius:4px}
.btn-logout:hover{color:var(--r)}


/* FINANCEIRO */
.fin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.fin-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.canal-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.canal-item:last-child{border:none;padding-bottom:0}
.canal-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.canal-info{flex:1}
.canal-nome{font-size:12px;font-weight:600}
.canal-bar-wrap{width:100%;height:3px;background:var(--bg3);border-radius:2px;margin-top:4px}
.canal-bar-fill{height:100%;border-radius:2px}
.canal-val{font-size:13px;font-weight:800;color:var(--txt);text-align:right;flex-shrink:0}
.sfi{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.sfi:last-child{border:none;padding-bottom:0}
.sfi-pos{font-size:11px;font-weight:800;width:18px;color:var(--txt3);flex-shrink:0}
.sfi-info{flex:1;min-width:0}
.sfi-nome{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfi-sub{font-size:9px;color:var(--txt3);margin-top:1px}
.sfi-val{font-size:13px;font-weight:800;color:var(--green);flex-shrink:0}

</style>
</head>
<body>
<div class="overlay" id="ov" onclick="closeSb()"></div>
<div class="app">
  <div class="sidebar" id="sb">
    <div class="logo-wrap"><div class="logo">ITTA<small>PIZZARIA</small></div></div>
    <div class="user-info" id="userInfo" style="display:none"><div class="user-avatar" id="userAvatar"></div><div><div class="user-name" id="userName"></div><div class="user-role" id="userRole"></div></div><button class="btn-logout" onclick="logout()" title="Sair">↩</button></div>
    <nav class="nav">
      <div class="nav-sec">Analytics</div>
      <div class="nav-item active" onclick="goPage('analytics',this)"><span class="nav-icon">📊</span>Visão geral</div>
      <div class="nav-item" onclick="goPage('sabores',this)"><span class="nav-icon">🍕</span>Sabores</div>
      <div class="nav-item" onclick="goPage('horarios',this)"><span class="nav-icon">⏱</span>Horários</div>
      <div class="nav-item" onclick="goPage('dias',this)"><span class="nav-icon">📅</span>Dias da semana</div>
      <div class="nav-item" onclick="goPage('bairros',this)"><span class="nav-icon">📍</span>Bairros</div>
      <div class="nav-item" onclick="goPage('clientes',this)"><span class="nav-icon">👥</span>Clientes</div>
      <div class="nav-item" onclick="goPage('cupons',this)"><span class="nav-icon">🎟️</span>Cupons</div>
      <div class="nav-sec">Dados</div>
      <div class="nav-item" onclick="goPage('financeiro',this)"><span class="nav-icon">💰</span>Financeiro</div>
      <div class="nav-item" onclick="goPage('tabela',this)"><span class="nav-icon">📋</span>Tabela completa</div>
    </nav>
    <div class="sidebar-foot">
      <div class="sync-row"><div class="sync-dot" id="sdot"></div><div class="sync-txt" id="stxt">Carregando...</div></div>
    </div>
  </div>

  <div class="content">
    <div class="topbar">
      <div class="topbar-l">
        <button class="menu-btn" onclick="toggleSb()">☰</button>
        <div><span class="page-ttl" id="pttl">Visão geral</span><span class="period-lbl" id="plbl"></span></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn-theme" id="btnTheme" onclick="toggleTheme()" title="Alternar tema">🌙</button>
        <button class="btn-apply" onclick="aplicar()">Aplicar filtros</button>
      </div>
    </div>

    <div class="flt-bar">
      <div class="flt"><label>Período</label>
        <select id="fP" onchange="chgP()">
          <option value="ontem">Ontem</option>
          <option value="7">Últimos 7 dias</option>
          <option value="15" selected>Últimos 15 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="mes">Este mês</option>
          <option value="mesant">Mês passado</option>
          <option value="livre">Período livre</option>
        </select>
      </div>
      <div class="flt" id="gIni" style="display:none"><label>De</label><input type="date" id="fIni" style="min-width:105px"></div>
      <div class="flt" id="gFim" style="display:none"><label>Até</label><input type="date" id="fFim" style="min-width:105px"></div>
      <div class="flt"><label>Tipo</label>
        <select id="fTipo"><option value="">Todos</option><option value="Salgada">Salgadas</option><option value="Doce">Doces</option></select>
      </div>
      <div class="flt"><label>Tamanho</label>
        <select id="fTam"><option value="">Todos</option><option value="Grande">Grande</option><option value="Média">Média</option><option value="Pequena">Pequena</option></select>
      </div>
      <div class="flt"><label>Sabor</label><select id="fSab" style="min-width:140px"><option value="">Todos</option></select></div>
      <div class="flt"><label>Dias da semana</label>
        <div class="dias-row">
          <button class="db on" data-d="Segunda">Seg</button><button class="db on" data-d="Terça">Ter</button>
          <button class="db on" data-d="Quarta">Qua</button><button class="db on" data-d="Quinta">Qui</button>
          <button class="db on" data-d="Sexta">Sex</button><button class="db on" data-d="Sábado">Sáb</button>
          <button class="db on" data-d="Domingo">Dom</button>
        </div>
      </div>
      <div class="flt"><label>Horário</label>
        <div class="hora-row">

<script>
const SID='16aLQ5RAKz_WCoA_7KwiGOlisOYrQlRUV17vijXG42TE';
const BASE=`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json&sheet=`;
// Para limitar período padrão de carregamento (últimos 6 meses = ~180 dias)

const SABS=["La Mortazza | Sabor do Mês","Calabresa","Frango com Catupiry","Calabresa Bombay","Calabresitta","Portuguesa","Marguerita","Quatro Queijos","Lombinho Agridoce","Pepperoni","Calabresa com Catupiry","Bela Parma","Calabronx","Gratinata","Jalapepper (muito apimentada)","La Caprina","Baconzola","Brie com Geleia de Pimenta","Bacon à Moda Itta","Nordestina","Atum","Baiana","Brie com Parma","Caipira Cremoso","Calabresa 4 queijos","Calabresa Especial","Camarão com Catupiry","Di Parma","Camarão com Pesto","Camarão Oriental","Imperial","Frango ao Pesto","Corn & Bacon","Marguerita Especial","Mussarela","Lombinho com Catupiry","Pepperoni com Catupiry","Pepperoni Supremo","Chocolate Meio a Meio"];

function norm(n){const s=(n||'').trim();for(const x of SABS){if(x.toLowerCase()===s.toLowerCase())return x;if(s.toLowerCase().includes(x.toLowerCase())||x.toLowerCase().includes(s.toLowerCase()))return x;}return s;}

let RAW=[],VRAW=[],VCMP=[],VHIST=[],BAIRROS=[],COORDS={},CLIENTES=[],CUPONS=[];

// Sidebar

// Período
function parseL(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function calcP(){
  const v=document.getElementById('fP').value,ag=new Date(),hj=new Date(ag.getFullYear(),ag.getMonth(),ag.getDate());
  let i,f;
  if(v==='livre'){i=parseL(document.getElementById('fIni').value);f=parseL(document.getElementById('fFim').value);}
  else if(v==='ontem'){const yd=new Date(hj.getFullYear(),hj.getMonth(),hj.getDate()-1);i=new Date(yd);f=new Date(yd);}
  else if(v==='mes'){i=new Date(hj.getFullYear(),hj.getMonth(),1);f=new Date(hj);}
  else if(v==='mesant'){i=new Date(hj.getFullYear(),hj.getMonth()-1,1);f=new Date(hj.getFullYear(),hj.getMonth(),0);}
  else{f=new Date(hj);i=new Date(hj.getFullYear(),hj.getMonth(),hj.getDate()-+v);}
  i.setHours(0,0,0,0);f.setHours(23,59,59,0);return{i,f};
}
function calcC(i,f){const d=f-i,cf=new Date(i-1),ci=new Date(cf-d);return{i:ci,f:cf};}
function chgP(){const v=document.getElementById('fP').value,l=v==='livre';document.getElementById('gIni').style.display=l?'':'none';document.getElementById('gFim').style.display=l?'':'none';}

    el.style.display='flex';
    const{i,f}=calcP(),{i:ci,f:cf}=calcC(i,f);

    document.getElementById('cAte').value=ds(cf);
  } else {
    el.style.display='none';
  }
  aplicar();
}
function p2(n){return String(n).padStart(2,'0');}
function ds(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fd(d){return p2(d.getDate())+'/'+p2(d.getMonth()+1);}

// Filtrar
function filtrar(dados,i,f){
  const dias=getDias();
  const todosOsDias = dias.length===0||dias.length===7;
  const tipo=document.getElementById('fTipo').value;
  const tam=document.getElementById('fTam').value;
  const sab=document.getElementById('fSab').value;
  const hi=document.getElementById('fHi').value||'17:30';
  const hf=document.getElementById('fHf').value||'23:00';
  const todoOHorario = hi==='17:30'&&hf==='23:00';
  const is=ds(i),fs=ds(f);
  const res=[];
  for(let k=0;k<dados.length;k++){
    const d=dados[k];
    if(!d.data||d.data<is||d.data>fs)continue;
    if(!todosOsDias&&!dias.includes(d.dia))continue;
    if(tipo&&d.tipo!==tipo)continue;
    if(tam&&d.tamanho!==tam)continue;
    if(sab&&d.sabor!==sab)continue;
    if(!todoOHorario&&(d.hora<hi||d.hora>hf))continue;
    res.push(d);
  }
  return res;
}

// Utils
function fmt(n){if(n===undefined||n===null)return'0';if(n%1===0)return Math.round(n).toLocaleString('pt-BR');return n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});}
function dlt(a,b){if(!b||b===0)return null;return((a-b)/b*100).toFixed(1);}
function badge(d,inv){if(d===null)return'';const pos=inv?+d<0:+d>0;return`<span class="db2 ${pos?'up':'dn'}">${+d>0?'↑':'↓'}${Math.abs(d)}%</span>`;}
function agrupS(dados){const m={};dados.forEach(d=>{if(!m[d.sabor])m[d.sabor]={total:0,G:0,M:0,P:0,tipo:d.tipo};m[d.sabor].total+=d.qtd;if(d.tamanho==='Grande')m[d.sabor].G+=d.qtd;else if(d.tamanho==='Média')m[d.sabor].M+=d.qtd;else if(d.tamanho==='Pequena')m[d.sabor].P+=d.qtd;});return m;}

const CO={responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#9a97a8',font:{size:11,family:'Plus Jakarta Sans'},boxWidth:10,padding:12}}},scales:{y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5a5768',font:{size:10}}},x:{grid:{display:false},ticks:{color:'#5a5768',font:{size:10},maxRotation:40}}}};

// Carregar dados
async function load(){
  try{
    const r=await fetch(BASE+encodeURIComponent('Sabores_6meses'));
    const t=await r.text();
    const j=JSON.parse(t.replace(/^[^\(]+\(/,'').replace(/\);?$/,''));
    function pH(v){if(!v)return'';if(typeof v==='string'&&v.startsWith('Date(')){const p=v.replace('Date(','').replace(')','').split(',');return p2(+p[3])+':'+p2(+p[4]);}if(typeof v==='string'&&v.match(/^\d{1,2}:\d{2}/))return v.substring(0,5);if(typeof v==='number'){const totalMin=Math.round(v*24*60);return p2(Math.floor(totalMin/60))+':'+p2(totalMin%60);}return'';}
    function pB(v){const h=pH(v);if(!h||h.includes('N'))return'';const p=h.split(':');if(p.length<2)return'';return p2(+p[0])+':'+(+p[1]<30?'00':'30');}
    function pD(v){if(!v)return'';if(typeof v==='string'&&v.startsWith('Date(')){const p=v.replace('Date(','').replace(')','').split(',');return p[0]+'-'+p2(+p[1]+1)+'-'+p2(+p[2]);}if(typeof v==='string')return v.substring(0,10);if(v instanceof Date)return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());return '';}
    RAW = []; // garante reset antes de processar
    const totalRows = j.table.rows.length;
    document.getElementById('mc').innerHTML='<div class="loading"><div class="spin"></div>Carregando dados... 0%</div>';
    
    await new Promise(resolve => {
      const CHUNK = 3000;
      let idx = 0;
      const rows = j.table.rows;
      
      function processChunk() {
        const end = Math.min(idx + CHUNK, rows.length);
        for (let i = idx; i < end; i++) {
          const r = rows[i];
          const d = {
            data:pD(r.c[0]?.v),hora:pH(r.c[1]?.v),bloco:pB(r.c[2]?.v)||pB(r.c[1]?.v),
            dia:r.c[3]?.v||'',sabor:norm(r.c[4]?.v||''),
            tamanho:r.c[5]?.v||'',tipo:r.c[6]?.v||'',
            qtd:parseFloat(r.c[7]?.v||0),id:String(r.c[8]?.v||'')
          };
          if (d.sabor && d.qtd > 0) RAW.push(d);
        }
        idx = end;
        const pct = Math.round(idx/totalRows*100);
        const mc = document.getElementById('mc');
        if (mc) mc.innerHTML='<div class="loading"><div class="spin"></div>Carregando dados... '+pct+'%</div>';
        if (idx < totalRows) { setTimeout(processChunk, 0); }
        else { console.log('RAW v2.0 carregado:', RAW.length, 'registros'); resolve(); }
      }
      setTimeout(processChunk, 0);
    });

    // Vendas_Historico (financeiro histórico completo)
    try{
      const urlH=BASE+encodeURIComponent('Vendas_Historico');
      const respH=await fetch(urlH);
      const txtH=await respH.text();
      const jsonH=JSON.parse(txtH.replace(/^[^\(]+\(/,'').replace(/\);?$/,''));
      const rawRowsH=jsonH.table.rows.slice(1);
      VHIST=rawRowsH.map(r=>{
        let dt='';
        const dv=r.c[1]?.v||'';
        if(typeof dv==='string'&&dv.startsWith('Date(')){
          const p=dv.replace('Date(','').replace(')','').split(',');
          dt=p[0]+'-'+String(parseInt(p[1])+1).padStart(2,'0')+'-'+String(parseInt(p[2])).padStart(2,'0');
        } else if(typeof dv==='string') dt=dv.substring(0,10);
        const st=r.c[7]?.v||'';
        return{id:String(r.c[0]?.v||''),data:dt,canal:r.c[2]?.v||'',subtotal:parseFloat(r.c[3]?.v||0),valor:parseFloat(r.c[4]?.v||0),desconto:parseFloat(r.c[5]?.v||0),entrega:parseFloat(r.c[6]?.v||0),cancelado:st.trim().toLowerCase()==='cancelado'};
      }).filter(d=>d.id); // mantém cancelados para cálculo
      console.log('Vendas_Historico:',VHIST.length,'(incl. cancelados)');
    }catch(e){console.log('VH err:',e);}

    // Vendas_Raw
    try{
      const rv=await fetch(BASE+encodeURIComponent('Vendas_Raw'));
      const tv=await rv.text();
      const jv=JSON.parse(tv.replace(/^[^\(]+\(/,'').replace(/\);?$/,''));
      VCMP=jv.table.rows.slice(1).map(r=>{
        const dv=r.c[1]?.v||'';let dt='';
        if(typeof dv==='string'&&dv.startsWith('Date(')){const p=dv.replace('Date(','').replace(')','').split(',');dt=p[0]+'-'+p2(+p[1]+1)+'-'+p2(+p[2]);}
        else if(typeof dv==='string')dt=dv.substring(0,10);
        const st=r.c[7]?.v||'';
        return{id:String(r.c[0]?.v||''),data:dt,st,cancel:st.trim().toLowerCase()==='cancelado'};
      }).filter(d=>d.id);
      VRAW=VCMP.filter(d=>!d.cancel);
    }catch(e){console.log('Vendas err',e);}

    // Bairros_Raw
    try{
      const urlBr=BASE+encodeURIComponent('Bairros_Raw');
      const respBr=await fetch(urlBr);
      const txtBr=await respBr.text();
      const jsonBr=JSON.parse(txtBr.replace(/^[^\(]+\(/,'').replace(/\);?$/,''));
      BAIRROS=jsonBr.table.rows.slice(1).map(r=>{
        let dt='';
        const dv=r.c[1]?.v||'';
        if(typeof dv==='string'&&dv.startsWith('Date(')){const p=dv.replace('Date(','').replace(')','').split(',');dt=p[0]+'-'+String(parseInt(p[1])+1).padStart(2,'0')+'-'+String(parseInt(p[2])).padStart(2,'0');}
        else if(typeof dv==='string')dt=dv.substring(0,10);
        const st=String(r.c[10]?.v||'');
        return{id:String(r.c[0]?.v||''),data:dt,bairro:r.c[2]?.v||'',rua:r.c[3]?.v||'',numero:r.c[4]?.v||'',cep:r.c[5]?.v||'',complemento:r.c[6]?.v||'',referencia:r.c[7]?.v||'',taxaEntrega:parseFloat(r.c[8]?.v||0),valor:parseFloat(r.c[9]?.v||0),status:st,cancelado:st==='Cancelado',tempoEntrega:parseFloat(r.c[12]?.v||0)||0};
      }).filter(d=>d.id);
      console.log('Bairros_Raw:',BAIRROS.length,'registros');
    }catch(e){console.log('Bairros err:',e);}

    // CEPs_Coords
    try{
      const urlC=BASE+encodeURIComponent('CEPs_Coords');
      const respC=await fetch(urlC);
      const txtC=await respC.text();
      const jsonC=JSON.parse(txtC.replace(/^[^\(]+\(/,'').replace(/\);?$/,''));
      jsonC.table.rows.slice(1).forEach(r=>{
        const b=r.c[0]?.v||'';
        const lat=parseFloat(r.c[1]?.v||0);
        const lng=parseFloat(r.c[2]?.v||0);
        if(b&&lat&&lng)COORDS[b]={lat,lng};
      });
      console.log('CEPs_Coords:',Object.keys(COORDS).length,'bairros');
    }catch(e){console.log('Coords err:',e);}

    // Clientes_Raw
    try{
      const urlCl=BASE+encodeURIComponent('Clientes_Raw');
      const respCl=await fetch(urlCl);
      const txtCl=await respCl.text();
      const jsonCl=JSON.parse(txtCl.replace(/^[^\(]+\(/,'').replace(/\);?$/,''));
      CLIENTES=jsonCl.table.rows.slice(1).map(r=>{
        let dt='';
        const dv=r.c[1]?.v||'';
        if(typeof dv==='string'&&dv.startsWith('Date(')){const p=dv.replace('Date(','').replace(')','').split(',');dt=p[0]+'-'+String(parseInt(p[1])+1).padStart(2,'0')+'-'+String(parseInt(p[2])).padStart(2,'0');}
        else if(typeof dv==='string')dt=dv.substring(0,10);
        const st=String(r.c[9]?.v||'');
        return{idPedido:String(r.c[0]?.v||''),data:dt,idCliente:String(r.c[2]?.v||''),nome:r.c[3]?.v||'',telefone:r.c[4]?.v||'',email:r.c[5]?.v||'',aniversario:r.c[6]?.v||'',canal:r.c[7]?.v||'',valor:parseFloat(r.c[8]?.v||0),status:st,cancelado:st==='Cancelado'};
      }).filter(d=>d.idPedido||d.idCliente);
      console.log('Clientes_Raw:',CLIENTES.length,'registros');
    }catch(e){console.log('Clientes err:',e);}

    // Cupons_Raw
    try{
      const urlCup=BASE+encodeURIComponent('Cupons_Raw');
      const respCup=await fetch(urlCup);
      const txtCup=await respCup.text();
      const jsonCup=JSON.parse(txtCup.replace(/^[^\(]+\(/,'').replace(/\);?$/,''));
      CUPONS=jsonCup.table.rows.slice(1).map(r=>{
        let dt='';

        if(typeof dv==='string'&&dv.startsWith('Date(')){const p=dv.replace('Date(','').replace(')','').split(',');dt=p[0]+'-'+String(parseInt(p[1])+1).padStart(2,'0')+'-'+String(parseInt(p[2])).padStart(2,'0');}

      }).filter(d=>d.cupom);

    }catch(e){console.log('Cupons err:',e);}

    const sel=document.getElementById('fSab');

    document.getElementById('sdot').style.background='#ef4444';

    console.error(e);return false;
  }
}

}

function blocoHTML(atual,ant){
  const BL=['17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30'];
  const mA={},mB={};BL.forEach(b=>{mA[b]=0;mB[b]=0;});
  atual.forEach(d=>{if(mA[d.bloco]!==undefined)mA[d.bloco]+=d.qtd;});
  ant.forEach(d=>{if(mB[d.bloco]!==undefined)mB[d.bloco]+=d.qtd;});
  const mx=Math.max(...Object.values(mA));
  return{html:BL.map(b=>{const v=mA[b],va=mB[b],d=dlt(v,va),pk=v>=mx*.85;return`<div class="bloco ${pk?'peak':''}"><div class="bl-h">${b}</div><div class="bl-v">${fmt(v)}</div><div class="bl-d">${d!==null?(+d>=0?'↑':'↓')+Math.abs(d)+'%':''}</div></div>`;}).join(''),mA,mB,BL};
}

function diasHTML(atual,ant,i,f,ci,cf){
  const DI=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'],AB=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const mA={},mB={},countA={},countB={};DI.forEach(d=>{mA[d]=0;mB[d]=0;countA[d]=0;countB[d]=0;});
  const idsA={},idsB={};
  atual.forEach(d=>{if(mA[d.dia]!==undefined&&d.id&&!idsA[d.dia+d.id]){mA[d.dia]++;idsA[d.dia+d.id]=1;}});
  ant.forEach(d=>{if(mB[d.dia]!==undefined&&d.id&&!idsB[d.dia+d.id]){mB[d.dia]++;idsB[d.dia+d.id]=1;}});
  if(i&&f){for(var dt=new Date(i);dt<=f;dt.setDate(dt.getDate()+1)){var dn=DI[dt.getDay()===0?6:dt.getDay()-1];if(countA[dn]!==undefined)countA[dn]++;}}
  if(ci&&cf){for(var dt2=new Date(ci);dt2<=cf;dt2.setDate(dt2.getDate()+1)){var dn2=DI[dt2.getDay()===0?6:dt2.getDay()-1];if(countB[dn2]!==undefined)countB[dn2]++;}}
  const mx=Math.max(...Object.values(mA));
  return{html:DI.map((d,idx)=>{const avg=countA[d]>0?mA[d]/countA[d]:0,avgB=countB[d]>0?mB[d]/countB[d]:0,dd=dlt(avg,avgB),pk=mA[d]>=mx*.9;return`<div class="dc ${pk?'peak':''}"><div class="dc-n">${AB[idx]}</div><div class="dc-v">${fmt(mA[d])}</div><div class="dc-d">${dd!==null?(+dd>=0?'↑':'↓')+Math.abs(dd)+'%':''}</div></div>`;}).join(''),mA,mB,DI,AB};
}

function aplicar(){
  try {
    const{i,f}=calcP();
    let ci,cf;
    if(cMode==='manual'){
      const de=document.getElementById('cDe').value,ate=document.getElementById('cAte').value;
      if(de&&ate){ci=new Date(de+'T00:00:00');cf=new Date(ate+'T23:59:59');}
      else{const auto=calcC(i,f);ci=auto.i;cf=auto.f;}
    } else {
      const auto=calcC(i,f);ci=auto.i;cf=auto.f;
    }
    const at=filtrar(RAW,i,f),an=filtrar(RAW,ci,cf);
    console.log('aplicar v2.0: page='+PAGE+' at='+at.length+' an='+an.length);
    document.getElementById('plbl').textContent=`${fd(i)}→${fd(f)} · vs ${fd(ci)}→${fd(cf)}`;
    Object.keys(CHARTS).forEach(k=>dC(k));
    if(PAGE==='financeiro'){pgFinanceiro(at,an,i,f,ci,cf);}
    else if(PAGE==='analytics')pgOverview(at,an,i,f,ci,cf);
    else if(PAGE==='sabores')pgSabores(at,an);
    else if(PAGE==='horarios')pgHorarios(at,an);
    else if(PAGE==='dias')pgDias(at,an,i,f,ci,cf);
    else if(PAGE==='bairros')pgBairros();
    else if(PAGE==='clientes')pgClientes();
    else if(PAGE==='cupons')pgCupons();
    else if(PAGE==='tabela')pgTabela(at,an);
  } catch(e) {
    console.error('ERRO em aplicar():', e.message, e.stack);
    document.getElementById('mc').innerHTML='<div class="loading" style="color:#ef4444">Erro: '+e.message+'</div>';
  }
}

function pgFinanceiro(at,an,i,f,ci,cf){
  const is=ds(i),fs=ds(f),cis=ds(ci),cfs=ds(cf);
  const mc=document.getElementById('mc');
  if(!mc)return;

  // Dados financeiros do período
  const vhA=VHIST.filter(v=>v.data>=is&&v.data<=fs); // todos incluindo cancelados
  const vhB=VHIST.filter(v=>v.data>=cis&&v.data<=cfs);

  // Fallback: usa Vendas_Raw se Vendas_Historico não tiver dados do período
  const vrA=VRAW.filter(v=>v.data>=is&&v.data<=fs);
  const vrB=VRAW.filter(v=>v.data>=cis&&v.data<=cfs);

  // Para faturamento: exclui cancelados
  const fA = (vhA.length>0 ? vhA : vrA.map(v=>({...v,valor:v.total||0,desconto:v.desconto||0,entrega:v.entrega||0,cancelado:false}))).filter(v=>!v.cancelado);
  const fB = (vhB.length>0 ? vhB : vrB.map(v=>({...v,valor:v.total||0,desconto:v.desconto||0,entrega:v.entrega||0,cancelado:false}))).filter(v=>!v.cancelado);

  const fatA=fA.reduce((s,v)=>s+v.valor,0);
  const fatB=fB.reduce((s,v)=>s+v.valor,0);
  const tickA=fA.length>0?(fatA/fA.length):0;
  const tickB=fB.length>0?(fatB/fB.length):0;
  const descA=fA.reduce((s,v)=>s+v.desconto,0);
  const descB=fB.reduce((s,v)=>s+v.desconto,0);
  const entA=fA.reduce((s,v)=>s+v.entrega,0);
  const entB=fB.reduce((s,v)=>s+v.entrega,0);

  // Cancelados em R$ — fallback para VCMP se VHIST não tiver dados do período
  const vhCancelA=VHIST.filter(v=>v.data>=is&&v.data<=fs&&v.cancelado);
  const vhCancelB=VHIST.filter(v=>v.data>=cis&&v.data<=cfs&&v.cancelado);
  const cancelSrcA=vhCancelA.length>0?vhCancelA:VCMP.filter(v=>v.data>=is&&v.data<=fs&&v.cancel);
  const cancelSrcB=vhCancelB.length>0?vhCancelB:VCMP.filter(v=>v.data>=cis&&v.data<=cfs&&v.cancel);
  const cancelValA=cancelSrcA.reduce((s,v)=>s+(v.valor||v.subtotal||v.total||0),0);
  const cancelValB=cancelSrcB.reduce((s,v)=>s+(v.valor||v.subtotal||v.total||0),0);
  const cancelQtA=cancelSrcA.length;
  const cancelQtB=cancelSrcB.length;
  const cancelValEstA=cancelQtA*tickA;
  const cancelValEstB=cancelQtB*tickB;

  const d1=dlt(fatA,fatB),d2=dlt(tickA,tickB),d3=dlt(descA,descB),d5=dlt(cancelValEstA,cancelValEstB);

  // Por canal
  const canais={};
  fA.forEach(v=>{const c=v.canal||'Outros';if(!canais[c])canais[c]=0;canais[c]+=v.valor;});
  const cList=Object.entries(canais).sort((a,b)=>b[1]-a[1]);
  const maxC=cList[0]?.[1]||1;
  const cColors=['#e03535','#f97316','#a855f7','#22c55e','#3b82f6','#eab308'];
  const canalHtml=cList.map(([nome,val],i)=>{
    const pct=Math.round(val/fatA*100);
    const barW=Math.round(val/maxC*100);
    return '<div class="canal-item">'+
      '<div class="canal-dot" style="background:'+cColors[i%cColors.length]+'"></div>'+
      '<div class="canal-info">'+
        '<div class="canal-nome">'+nome+'</div>'+
        '<div class="canal-bar-wrap"><div class="canal-bar-fill" style="width:'+barW+'%;background:'+cColors[i%cColors.length]+'"></div></div>'+
        '<div style="font-size:9px;color:var(--txt3);margin-top:2px">'+pct+'% do faturamento</div>'+
      '</div>'+
      '<div class="canal-val">'+fmtR(val)+'</div>'+
    '</div>';
  }).join('');

  // Receita estimada por sabor (R$ médio por tamanho × quantidade)
  // Preços médios Itta
  const PRECO={Grande:89.9,Media:59.9,Pequena:39.9};
  const mapaA=agrupS(at);
  const saborFin=Object.entries(mapaA).sort((a,b)=>b[1].total-a[1].total).slice(0,10).map(([sab,v])=>{
    const recEst=(v.G||0)*PRECO.Grande+(v.M||0)*PRECO.Media+(v.P||0)*PRECO.Pequena;
    return{sab,v,recEst};
  }).sort((a,b)=>b.recEst-a.recEst);
  const maxRec=saborFin[0]?.recEst||1;
  const saborHtml=saborFin.map((s,i)=>{

  const fdA={},fdB={};DI.forEach(d=>{fdA[d]=0;fdB[d]=0;});

  });
  fB.forEach(v=>{
    if(v.data){const dt=new Date(v.data+'T12:00:00');const d=DI[dt.getDay()===0?6:dt.getDay()-1];if(d)fdB[d]+=v.valor;}
  });

  // Faturamento por hora (usando Sabores_Raw com preço estimado)
  const BLO=['17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30'];
  const fhA={},fhB={};BLO.forEach(b=>{fhA[b]=0;fhB[b]=0;});
  at.forEach(d=>{
    if(fhA[d.bloco]!==undefined){
      const p=d.tamanho==='Grande'?PRECO.Grande:d.tamanho==='Média'?PRECO.Media:PRECO.Pequena;
      fhA[d.bloco]+=d.qtd*p;
    }
  });
  an.forEach(d=>{
    if(fhB[d.bloco]!==undefined){
      const p=d.tamanho==='Grande'?PRECO.Grande:d.tamanho==='Média'?PRECO.Media:PRECO.Pequena;
      fhB[d.bloco]+=d.qtd*p;
    }
  });

  // Evolução diária de faturamento
  const datas=[...new Set(fA.map(v=>v.data))].sort();
  const datasB=[...new Set(fB.map(v=>v.data))].sort();
  const mFA={},mFB={};
  fA.forEach(v=>{mFA[v.data]=(mFA[v.data]||0)+v.valor;});
  fB.forEach(v=>{mFB[v.data]=(mFB[v.data]||0)+v.valor;});

  mc.innerHTML=
    '<div class="metrics">'+
    '<div class="mc green"><div class="mc-icon">💰</div><div class="mc-lbl">Faturamento líquido</div><div class="mc-val" style="font-size:22px">'+fmtR(fatA)+'</div><div class="mc-comp">'+badge(d1)+'<span class="mc-ct">vs ant. ('+fmtR(fatB)+')</span></div></div>'+

function haversine(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function renderDistTable(bucketList,sort){
  const sorted=[...bucketList];
  if(sort==='dist_asc')sorted.sort((a,b)=>a[1].order-b[1].order);
  else if(sort==='dist_desc')sorted.sort((a,b)=>b[1].order-a[1].order);
  else if(sort==='fat_asc')sorted.sort((a,b)=>a[1].faturamento-b[1].faturamento);
  else if(sort==='fat_desc')sorted.sort((a,b)=>b[1].faturamento-a[1].faturamento);
  if(!sorted.length)return'<div style="color:var(--txt3);font-size:12px;padding:20px 0;text-align:center">Sem coordenadas disponíveis para calcular distâncias.</div>';
  const totalDistPed=sorted.reduce((s,[,v])=>s+v.pedidos,0);
  const maxDistPed=Math.max(...sorted.map(([,v])=>v.pedidos),1);
  const hdr=`<div style="display:flex;align-items:center;gap:10px;padding:0 0 8px;border-bottom:1px solid var(--border2);margin-bottom:2px"><div style="font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;width:90px;flex-shrink:0">Faixa</div><div style="flex:1"></div><div style="font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;width:30px;text-align:right;flex-shrink:0">%</div><div style="font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;width:40px;text-align:right;flex-shrink:0">Pedidos</div><div style="font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;width:80px;text-align:right;flex-shrink:0">Fat.</div></div>`;
  return hdr+sorted.map(([key,v])=>{
    const pct=Math.round(v.pedidos/maxDistPed*100);
    const pctTot=totalDistPed>0?Math.round(v.pedidos/totalDistPed*100):0;
    return`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)"><div style="font-size:11px;font-weight:700;width:90px;flex-shrink:0;color:var(--txt2)">${key}</div><div style="flex:1"><div style="height:4px;background:var(--bg3);border-radius:2px"><div style="width:${pct}%;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--purple))"></div></div></div><div style="font-size:11px;color:var(--txt3);width:30px;text-align:right;flex-shrink:0">${pctTot}%</div><div style="font-size:12px;font-weight:700;width:40px;text-align:right;flex-shrink:0">${v.pedidos}</div><div style="font-size:11px;color:var(--green);width:80px;text-align:right;flex-shrink:0">${fmtR(v.faturamento)}</div></div>`;
  }).join('');
}

function pgBairros(){
  distSort='dist_asc';
  const{i,f}=calcP();
  const is=ds(i),fs=ds(f);
  const mc=document.getElementById('mc');
  if(!mc)return;
  if(!BAIRROS.length){mc.innerHTML='<div class="loading">Dados de bairros não disponíveis.</div>';return;}
  const dados=BAIRROS.filter(d=>d.data>=is&&d.data<=fs&&!d.cancelado);
  if(!dados.length){mc.innerHTML='<div class="loading">Sem dados para o período selecionado.</div>';return;}
  const map={};
  dados.forEach(d=>{const b=d.bairro||'Desconhecido';if(!map[b])map[b]={pedidos:0,faturamento:0};map[b].pedidos++;map[b].faturamento+=d.valor||0;});
  const allList=Object.entries(map);
  const totalPedidos=allList.reduce((s,[,v])=>s+v.pedidos,0);
  const byPed=[...allList].sort((a,b)=>b[1].pedidos-a[1].pedidos).slice(0,15);
  const byFat=[...allList].sort((a,b)=>b[1].faturamento-a[1].faturamento).slice(0,15);
  const maxPed=byPed[0]?.[1].pedidos||1;
  const maxFat=byFat[0]?.[1].faturamento||1;
  const leftRows=byPed.map(([bairro,v],idx)=>{
    const cls=idx===0?'g1':idx===1?'g2':idx===2?'g3':'';
    const pct=Math.round(v.pedidos/maxPed*100);
    const pctTot=totalPedidos>0?Math.round(v.pedidos/totalPedidos*100):0;
    return`<div class="ri"><div class="ri-pos ${cls}">${idx+1}</div><div class="ri-info"><div class="ri-nome">${bairro}</div><div style="font-size:9px;color:var(--txt3);margin-top:2px">${pctTot}% dos pedidos · ${fmtR(v.faturamento)}</div><div class="ri-bar"><div class="ri-bar-fill" style="width:${pct}%"></div></div></div><div class="ri-qtd">${v.pedidos}</div></div>`;
  }).join('');
  const rightRows=byFat.map(([bairro,v],idx)=>{
    const cls=idx===0?'g1':idx===1?'g2':idx===2?'g3':'';
    const pct=Math.round(v.faturamento/maxFat*100);
    const tick=v.pedidos>0?v.faturamento/v.pedidos:0;
    return`<div class="ri"><div class="ri-pos ${cls}">${idx+1}</div><div class="ri-info"><div class="ri-nome">${bairro}</div><div style="font-size:9px;color:var(--txt3);margin-top:2px">ticket ${fmtR(tick)} · ${v.pedidos} pedidos</div><div class="ri-bar"><div class="ri-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--green),var(--teal))"></div></div></div><div class="ri-qtd" style="font-size:11px;color:var(--green)">${fmtR(v.faturamento)}</div></div>`;
  }).join('');
  // Distance buckets
  const STORE_LAT=-12.9891,STORE_LNG=-38.4572;
  const buckets={};
  dados.forEach(d=>{
    const coord=COORDS[d.bairro];
    if(!coord)return;
    const dist=haversine(STORE_LAT,STORE_LNG,coord.lat,coord.lng);
    const bk=dist>=15?15:Math.floor(dist/0.5)*0.5;
    const key=bk===15?'15km+':`${bk.toFixed(1)}–${(bk+0.5).toFixed(1)} km`;
    if(!buckets[key])buckets[key]={pedidos:0,faturamento:0,order:bk};
    buckets[key].pedidos++;
    buckets[key].faturamento+=d.valor||0;
  });
  _distBuckets=Object.entries(buckets);
  // Tempo de entrega por bairro
  const tempoMap={};
  dados.forEach(d=>{
    if(!d.tempoEntrega||d.tempoEntrega<=0||d.tempoEntrega>140)return;
    const b=d.bairro||'Desconhecido';
    if(!tempoMap[b])tempoMap[b]=[];
    tempoMap[b].push(d.tempoEntrega);
  });
  const tempoList=Object.entries(tempoMap)
    .filter(([,tempos])=>tempos.length>=3)
    .map(([bairro,tempos])=>{
      const count=tempos.length;
      const avg=Math.round(tempos.reduce((s,t)=>s+t,0)/count);
      const min=Math.min(...tempos);
      const max=Math.max(...tempos);
      const pctSLA=Math.round(tempos.filter(t=>t<=60).length/count*100);
      const coord=COORDS[bairro];
      const dist=coord?haversine(STORE_LAT,STORE_LNG,coord.lat,coord.lng):null;
      return{bairro,count,avg,min,max,pctSLA,dist};
    })
    .sort((a,b)=>a.avg-b.avg)
    .slice(0,20);
  _tempoList=tempoList;
  tempoSort='dist_asc';
  const tempoSortBtns=[['dist_asc','Distância ↑'],['dist_desc','Distância ↓'],['count_asc','Pedidos ↑'],['count_desc','Pedidos ↓']].map(([m,l])=>`<button class="tempo-sort-btn" data-sort="${m}" onclick="sortTempoBairros('${m}')" style="font-size:10px;font-weight:600;padding:4px 8px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;transition:all .15s;background:${m===tempoSort?'var(--blue)':'var(--bg3)'};color:${m===tempoSort?'#fff':'var(--txt2)'}">${l}</button>`).join('');
  const sortBtns=[['dist_asc','Distância ↑'],['dist_desc','Distância ↓'],['fat_asc','Faturamento ↑'],['fat_desc','Faturamento ↓']].map(([m,l])=>`<button class="dist-sort-btn" data-sort="${m}" onclick="sortDist('${m}')" style="font-size:10px;font-weight:600;padding:4px 8px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;transition:all .15s;background:${m===distSort?'var(--blue)':'var(--bg3)'};color:${m===distSort?'#fff':'var(--txt2)'}">${l}</button>`).join('');
  mc.innerHTML=`<div class="g2" style="margin-bottom:14px"><div class="card"><div class="card-hdr"><div><div class="card-ttl">Ranking por pedidos</div><div class="card-sub">Top 15 bairros · ${totalPedidos} pedidos no período</div></div></div>${leftRows}</div><div class="card"><div class="card-hdr"><div><div class="card-ttl">Ranking por faturamento</div><div class="card-sub">Top 15 bairros · faturamento acumulado</div></div></div>${rightRows}</div></div><div class="card" style="margin-bottom:14px"><div class="card-hdr"><div><div class="card-ttl">Distribuição por distância da loja</div><div class="card-sub">Faixas de 0.5 km · linha reta até a Itta Pizzaria</div></div><div style="display:flex;gap:4px;flex-wrap:wrap">${sortBtns}</div></div><div id="distTable">${renderDistTable(_distBuckets,distSort)}</div></div><div class="card"><div class="card-hdr"><div><div class="card-ttl">Tempo médio de entrega por bairro</div><div class="card-sub">created_at → updated_at · mín. 3 entregas com dado de tempo · top 20 mais rápidos</div></div><div style="display:flex;gap:4px;flex-wrap:wrap">${tempoSortBtns}</div></div><div id="tempoTable"></div></div>`;
  renderTempoBairros();
}

function pgClientes(){
  const{i,f}=calcP();
  const is=ds(i),fs=ds(f);
  const mc=document.getElementById('mc');
  if(!mc)return;
  if(!CLIENTES.length){mc.innerHTML='<div class="loading">Dados de clientes não disponíveis.</div>';return;}
  const dados=CLIENTES.filter(d=>d.data>=is&&d.data<=fs&&!d.cancelado);
  if(!dados.length){mc.innerHTML='<div class="loading">Sem dados para o período selecionado.</div>';return;}

  // Group by client for the period
  const mapa={};
  dados.forEach(d=>{
    const id=d.idCliente||d.nome||'Desconhecido';
    if(!mapa[id])mapa[id]={nome:d.nome||id,pedidos:0,faturamento:0,lastDate:'',canal:d.canal,key:id};
    mapa[id].pedidos++;
    mapa[id].faturamento+=d.valor||0;
    if(d.data>mapa[id].lastDate){mapa[id].lastDate=d.data;mapa[id].canal=d.canal;}
  });
  const cList=Object.values(mapa);
  const totalUnicos=cList.length;
  const totalFat=cList.reduce((s,v)=>s+v.faturamento,0);
  const recorrentes=cList.filter(v=>v.pedidos>=2).length;
  const pctRec=totalUnicos>0?Math.round(recorrentes/totalUnicos*100):0;
  const ticketPorCliente=totalUnicos>0?totalFat/totalUnicos:0;
  const melhor=[...cList].sort((a,b)=>b.pedidos-a.pedidos)[0];

  // Rankings
  _byPed=[...cList].sort((a,b)=>b.pedidos-a.pedidos).slice(0,15);
  _byFat=[...cList].sort((a,b)=>b.faturamento-a.faturamento).slice(0,15);
  clienteSearch='';

  // Full client history — classification and LTV
  const today=new Date();
  const cutoff30=new Date(today);cutoff30.setDate(cutoff30.getDate()-30);
  const cutoff60=new Date(today);cutoff60.setDate(cutoff60.getDate()-60);
  const cutoff30Str=ds(cutoff30);
  const cutoff60Str=ds(cutoff60);
  const activePeriodKeys=new Set(dados.map(d=>d.idCliente||d.nome||'Desconhecido'));
  const histMap={};
  CLIENTES.filter(d=>!d.cancelado).forEach(d=>{
    const id=d.idCliente||d.nome||'Desconhecido';
    if(!histMap[id])histMap[id]={nome:d.nome||id,pedidos:0,faturamento:0,lastDate:'',firstDate:'',key:id};
    histMap[id].pedidos++;
    histMap[id].faturamento+=d.valor||0;
    if(d.data>histMap[id].lastDate)histMap[id].lastDate=d.data;
    if(!histMap[id].firstDate||d.data<histMap[id].firstDate)histMap[id].firstDate=d.data;
  });
  const histList=Object.values(histMap);
  const cntAtivos=histList.filter(v=>v.lastDate>=cutoff30Str).length;
  const cntEmRisco=histList.filter(v=>v.lastDate>=cutoff60Str&&v.lastDate<cutoff30Str).length;
  const cntInativos=histList.filter(v=>v.lastDate<cutoff60Str).length;
  const cntNovos=histList.filter(v=>v.firstDate>=is&&v.firstDate<=fs).length;
  // LTV — recurring clients only (≥2 orders)
  const ltvData=histList.filter(v=>v.pedidos>=2&&v.firstDate&&v.lastDate&&v.firstDate<v.lastDate).map(v=>{
    const daySpan=Math.max(Math.floor((new Date(v.lastDate+'T12:00:00')-new Date(v.firstDate+'T12:00:00'))/(1000*60*60*24)),1);
    return{...v,ltv:(v.faturamento/Math.max(daySpan/30,1))*12,daySpan};

  const top3LTVHtml=top3LTV.map((v,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;${i<top3LTV.length-1?'border-bottom:1px solid var(--border)':''}"><span style="font-size:11px;color:var(--txt2);font-weight:600">${v.nome}</span><span style="font-size:11px;color:var(--green);font-weight:700">${fmtR(v.ltv)}/ano</span></div>`).join('')||'<div style="color:var(--txt3);font-size:11px">Dados insuficientes</div>';
  const pedidosVHIST=VHIST.filter(v=>v.data>=is&&v.data<=fs&&!v.cancelado).length;

      <div class="mc blue"><div class="mc-icon">👥</div><div class="mc-lbl">Clientes no período</div><div class="mc-val">${totalUnicos}</div><div class="mc-comp"><span class="mc-ct">${dados.length} pedidos identificados${semCadastro>0?' · '+semCadastro+' sem cadastro':''}</span></div></div>
      <div class="mc green"><div class="mc-icon">🆕</div><div class="mc-lbl">Novos clientes</div><div class="mc-val">${cntNovos}</div><div class="mc-comp"><span class="mc-ct">${totalUnicos>0?Math.round(cntNovos/totalUnicos*100):0}% dos clientes do período</span></div></div>
      <div class="mc purple"><div class="mc-icon">🔄</div><div class="mc-lbl">Clientes recorrentes</div><div class="mc-val">${totalUnicos-cntNovos}</div><div class="mc-comp"><span class="mc-ct">${totalUnicos>0?Math.round((totalUnicos-cntNovos)/totalUnicos*100):0}% dos clientes do período</span></div></div>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px">Base total de clientes</div>

function pgCupons(){
  const{i,f}=calcP();
  const is=ds(i),fs=ds(f);
  const mc=document.getElementById('mc');
  if(!mc)return;
  if(!CUPONS.length){mc.innerHTML='<div class="loading">Dados de cupons não disponíveis.</div>';return;}

  function groupByCupom(list){
    const m={};
    list.forEach(d=>{
      const k=d.cupom||'(sem nome)';
      if(!m[k])m[k]={cupom:k,tipo:d.tipo,usos:0,valorTotal:0,descontoTotal:0};
      m[k].usos++;
      m[k].valorTotal+=d.valorTotal||0;
      m[k].descontoTotal+=d.descontoTotal||0;
      if(d.tipo&&!m[k].tipo)m[k].tipo=d.tipo;
    });
    return Object.values(m).sort((a,b)=>b.usos-a.usos);
  }

  const dados=CUPONS.filter(d=>d.data>=is&&d.data<=fs&&!d.cancelado);
  const ranking=groupByCupom(dados);

    const c=t==='%'?'var(--purple)':t==='R$'?'var(--green)':'var(--blue)';

    }).join('');
  }

  const maxH=historico[0]?.usos||1;

    <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
      <div class="mc blue"><div class="mc-icon">🎟️</div><div class="mc-lbl">Total de usos no período</div><div class="mc-val">${totalUsos}</div><div class="mc-comp"><span class="mc-ct">${ranking.length} cupons distintos</span></div></div>
      <div class="mc red"><div class="mc-icon">💸</div><div class="mc-lbl">Desconto total concedido</div><div class="mc-val" style="font-size:20px">${fmtR(totalDesconto)}</div><div class="mc-comp"><span class="mc-ct">no período selecionado</span></div></div>
      <div class="mc orange"><div class="mc-icon">🏆</div><div class="mc-lbl">Cupom mais usado</div><div class="mc-val" style="font-size:16px;line-height:1.2">${maisUsado?.cupom||'–'}</div><div class="mc-comp"><span class="mc-ct">${maisUsado?.usos||0} usos no período</span></div></div>
    </div>
    <div class="card" style="margin-bottom:14px"><div class="card-hdr"><div><div class="card-ttl">Ranking de cupons no período</div><div class="card-sub">${ranking.length} cupons · ${totalUsos} usos entre ${is.substring(5).replace('-','/')} e ${fs.substring(5).replace('-','/')}</div></div><input type="text" placeholder="Buscar cupom..." oninput="cupomSearch=this.value.toLowerCase();renderCupomRanking()" style="font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--txt);font-family:inherit;outline:none;width:160px"></div><div id="cupomRankingBody"></div></div>
    <div class="card"><div class="card-hdr"><div><div class="card-ttl">Top 10 histórico (todos os tempos)</div><div class="card-sub">${historico.length} cupons distintos · histórico completo</div></div></div><div class="tw"><table>${thead}<tbody>${rankRows(historico.slice(0,10),maxH)}</tbody></table></div></div>`;
  renderCupomRanking();
}

function pgTabela(at,an){
  const mA=agrupS(at),mB=agrupS(an);
  const lista=Object.entries(mA).sort((a,b)=>b[1].total-a[1].total);
  const rows=lista.map(([s,v],i)=>{const va=mB[s]?.total||0,d=dlt(v.total,va);return`<tr><td>${i+1}</td><td>${s}</td><td style="color:var(--txt2)">${v.tipo}</td><td style="text-align:center">${fmt(v.G||0)}</td><td style="text-align:center">${fmt(v.M||0)}</td><td style="text-align:center">${fmt(v.P||0)}</td><td style="text-align:center;font-weight:700">${fmt(v.total)}</td><td style="text-align:center;color:var(--txt3)">${fmt(va)}</td><td style="text-align:center">${d!==null?badge(d):'-'}</td></tr>`;}).join('');
  document.getElementById('mc').innerHTML=`<div class="card"><div class="card-hdr"><div><div class="card-ttl">Todos os sabores</div><div class="card-sub">${lista.length} sabores com comparativo completo</div></div></div><div class="tw"><table><thead><tr><th>#</th><th>Sabor</th><th>Tipo</th><th style="text-align:center">Grande</th><th style="text-align:center">Média</th><th style="text-align:center">Pequena</th><th style="text-align:center">Total</th><th style="text-align:center">Anterior</th><th style="text-align:center">Var.</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}


// ================================================================
// SISTEMA DE LOGIN
// ================================================================
const USUARIOS_SHEET = BASE + encodeURIComponent('Usuarios');
const SESSION_KEY = 'itta_session';
const SESSION_HOURS = 8;

// Módulos disponíveis e suas colunas na planilha (índice 0 = col A)
const MODULOS_MAP = {
  analytics: 3,  // col D
  sabores:   4,  // col E
  horarios:  5,  // col F
  dias:      6,  // col G
  tabela:    7,  // col H
  demandas:  8,  // col I
  estoque:   9,  // col J
};

let USUARIO_ATUAL = null;

// Verifica sessão salva
function verificarSessao() {
  try {
    const s = localStorage.getItem(SESSION_KEY);
    if (!s) return false;
    const sess = JSON.parse(s);
    if (!sess || !sess.expiry) return false;
    if (Date.now() > sess.expiry) { localStorage.removeItem(SESSION_KEY); return false; }
    USUARIO_ATUAL = sess.usuario;
    return true;
  } catch(e) { return false; }
}

// Login
async function fazerLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const senha = document.getElementById('loginSenha').value;
  const err   = document.getElementById('loginErr');
  const load  = document.getElementById('loginLoading');

  if (!email || !senha) { err.textContent='Preencha email e senha'; err.style.display='block'; return; }

  err.style.display='none';
  load.style.display='block';

  try {
    const resp = await fetch(USUARIOS_SHEET);
    const txt  = await resp.text();
    const json = JSON.parse(txt.replace(/^[^\(]+\(/,'').replace(/\);?$/,''));
    const rows = json.table.rows;

    let usuarioEncontrado = null;
    for (const row of rows) {
      const rEmail = (row.c[1]?.v||'').toLowerCase().trim();
      const rSenha = (row.c[2]?.v||'').trim();
      if (rEmail === email && rSenha === senha) {
        usuarioEncontrado = {
          nome:     row.c[0]?.v || 'Usuário',
          email:    rEmail,
          modulos:  {},
          admin:    (row.c[10]?.v||'').toUpperCase() === 'SIM',
        };
        // Lê permissões de cada módulo
        Object.entries(MODULOS_MAP).forEach(([mod, colIdx]) => {
          usuarioEncontrado.modulos[mod] = (row.c[colIdx]?.v||'').toUpperCase() === 'SIM';
        });
        break;
      }
    }

    load.style.display='none';

    if (!usuarioEncontrado) {
      err.textContent='Email ou senha incorretos';
      err.style.display='block';
      return;
    }

    // Salva sessão por 8h
    const sess = { usuario: usuarioEncontrado, expiry: Date.now() + SESSION_HOURS * 3600000 };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
    USUARIO_ATUAL = usuarioEncontrado;
    entrarNoDashboard();

  } catch(e) {
    load.style.display='none';
    err.textContent='Erro ao conectar. Tente novamente.';
    err.style.display='block';
    console.error(e);
  }
}

// Entra no dashboard após login
function entrarNoDashboard() { _appIniciado=true;
  const lo=document.getElementById('loginOverlay'); if(lo) lo.style.display='none';
  document.getElementById('mc').innerHTML='<div class="loading"><div class="spin"></div>Conectando ao Saipos...</div>';

  // Mostra info do usuário na sidebar
  const u = USUARIO_ATUAL;
  document.getElementById('userInfo').style.display='flex';
  document.getElementById('userName').textContent = u.nome;
  document.getElementById('userRole').textContent = u.admin ? 'Administrador' : 'Gestor';
  document.getElementById('userAvatar').textContent = u.nome.charAt(0).toUpperCase();

  // Filtra menu conforme permissões
  aplicarPermissoes();

  // Carrega dados
  iniciarApp();
}

// Aplica permissões no menu
function aplicarPermissoes() {
  if (!USUARIO_ATUAL) return;
  const mods = USUARIO_ATUAL.modulos;

  // Mapeia page → nav-item
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    const onclick = item.getAttribute('onclick') || '';
    const match = onclick.match(/goPage\('(\w+)'/);
    if (!match) return;
    const page = match[1];
    if (mods[page] === false) {
      item.style.display='none';
    }
  });

  // Define página inicial como a primeira permitida
  const ordem = ['analytics','sabores','horarios','dias','tabela','demandas','estoque'];
  for (const p of ordem) {
    if (mods[p] !== false) { PAGE = p; break; }
  }
}

// Logout
function logout() {
  localStorage.removeItem(SESSION_KEY);
  USUARIO_ATUAL = null;
  location.reload();
}

// Permissões verificadas dentro do goPage original
// ================================================================

// Init com verificação de sessão
async function iniciarApp() {
  const ok = await load();
  if (!ok) { document.getElementById('mc').innerHTML='<div class="loading" style="color:#ef4444">Erro ao conectar. Verifique se a planilha está pública.</div>'; return; }
  console.log('iniciarApp: chamando aplicar(), RAW=', RAW.length);
  aplicar();
}

// Ponto de entrada
let _appIniciado = false;
applyTheme(localStorage.getItem(THEME_KEY)||'dark');
(async()=>{
  const lo = document.getElementById('loginOverlay');
  if (verificarSessao()) {
    if (lo) lo.style.display='none';
    if (!_appIniciado) { _appIniciado=true; entrarNoDashboard(); }
  } else {
    if (lo) lo.style.display='flex';
  }
})();

</script>
